  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: -1000, y: -1000 };

    function resizeCanvas() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
      
      // Redistribute particles across the updated window size to prevent top-left/corner clumping
      if (particles.length > 0) {
        particles.forEach(p => {
          p.x = Math.random() * canvas.width;
          p.y = Math.random() * canvas.height;
        });
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.radius = Math.random() * 1.5 + 0.5;
        this.life = 0;
        this.maxLife = 200 + Math.random() * 300;
        this.alpha = 0;
      }
      update() {
        this.life++;
        if (this.life >= this.maxLife) { this.alpha -= 0.003; if (this.alpha <= 0) this.reset(); }
        else if (this.alpha < 0.3) { this.alpha += 0.005; }
        const dx = this.x - mouse.x, dy = this.y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const r = 180;
        if (dist < r) {
          const force = (r - dist) / 60000;
          this.vx -= dx * force; this.vy -= dy * force;
          if (dist < 40) { const b = (40-dist)/50; this.vx += dx*b*0.02; this.vy += dy*b*0.02; }
        }
        this.x += this.vx; this.y += this.vy;
        this.vx *= 0.985; this.vy *= 0.985;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
        ctx.shadowBlur = 4; ctx.shadowColor = "white";
        ctx.fill();
      }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());
    
    // Explicitly redistribute particles correctly once window resources are fully ready
    resizeCanvas();

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    ];
    function animBg(t) {
      blobDefs.forEach((b, i) => {
        const nx = basePos[i][0] + Math.sin(t * b.speed[0] + b.phase[0]) * 20;
        const ny = basePos[i][1] + Math.cos(t * b.speed[1] + b.phase[1]) * 15;
        document.body.style.setProperty(`--b${i+1}x`, `${nx}%`);
        document.body.style.setProperty(`--b${i+1}y`, `${ny}%`);

    function updateClock() {

      if (!el) return;
      el.textContent = new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      }).format(new Date());
    }
    setInterval(updateClock, 1000);

    const pages = [
      'About Me',
      'Featured Projects',
      'Assignments',
      'Certifications'
    ];
    const btns = document.querySelectorAll('.nav-btn');
    const indicator = document.getElementById('navIndicator');
    const titleEl = document.getElementById('pageTitle');
    const contentContainer = document.getElementById('mainContent');

    function updateIndicator(idx) {
      const btn = btns[idx];
      if (btn) { indicator.style.left = btn.offsetLeft + 'px'; indicator.style.width = btn.offsetWidth + 'px'; }
    }


    function createLockedPage(content) {
    return `
      <div class="locked-page">
        <div class="locked-content">
          ${content}
        </div>
  
        <div class="password-overlay">
          <div class="password-box">
            <h3>Protected Content</h3>

              id="passwordInput"

              placeholder="Password"

            </button>
  
            <div class="password-error" id="passwordError"></div>
          </div>
        </div>
      </div>
    `;
  }
  
  window.unlockProtectedContent = function () {
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("passwordError");
  
    if (input.value === ASSIGNMENT_PASSWORD) {
      assignmentsUnlocked = true;
  
      const activeIdx =
        parseInt(document.querySelector(".nav-btn.active").dataset.idx);
  
      switchPage(activeIdx);
    } else {
      error.textContent = "Incorrect password.";
    }
  };
    
    function switchPage(idx) {
      contentContainer.style.opacity = 0;
      contentContainer.style.transform = 'translateY(10px)';
      titleEl.style.opacity = 0;
      setTimeout(() => {
        titleEl.textContent = pages[idx];
        if ((idx === 2 || idx === 3) && !assignmentsUnlocked) {
          contentContainer.innerHTML =
            createLockedPage(contentData[idx]);
        } else {
          contentContainer.innerHTML = contentData[idx];
        }
        lucide.createIcons();
        if (idx === 0) updateClock();

        const pageContent = document.getElementById('pageContent');
        if (idx === 1 || idx === 2 || idx === 3) {
          pageContent.classList.add('wide-layout');
        } else {
          pageContent.classList.remove('wide-layout');
        }

        const sb = SimpleBar.instances.get(document.getElementById('scrollArea'));
        if (sb) sb.getScrollElement().scrollTop = 0;

        contentContainer.style.opacity = 1;
        contentContainer.style.transform = 'translateY(0px)';
        titleEl.style.opacity = 1;
      }, 300);
    }

    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        switchPage(idx);
        updateIndicator(idx);
      });
    });

    window.onload = () => {
      updateIndicator(0);
      contentContainer.innerHTML = contentData[0];
      lucide.createIcons();
      updateClock();
    };

    window.addEventListener('resize', () => {
      const active = document.querySelector('.nav-btn.active');
      if (active) updateIndicator(parseInt(active.dataset.idx));
    });
